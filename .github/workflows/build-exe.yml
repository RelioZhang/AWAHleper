name: Build Windows EXE

# 手动触发（Actions 页面点 Run workflow），也可打 tag 自动打包并发布
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install PySide6 pyinstaller openpyxl

      - name: 显示依赖版本
        run: |
          python --version
          python -c "import PySide6; print('PySide6', PySide6.__version__)"
          python -m PyInstaller --version

      # PyInstaller 自动分析 import，只带用到的 Qt 模块。
      # 两种产物分开 build/dist 目录，避免互相覆盖。
      #
      # 单文件夹版：启动快（不每次解压），适合自己电脑长期用
      - name: 打包（单文件夹版）
        working-directory: data-manager
        shell: cmd
        run: |
          python -m PyInstaller --noconfirm --clean --windowed ^
            --name "AWA数据管理" ^
            --distpath dist-dir --workpath build-dir ^
            --hidden-import openpyxl ^
            --hidden-import PySide6.QtSvg ^
            desktop.py

      - name: 打压缩包（单文件夹版）
        shell: pwsh
        run: |
          Compress-Archive -Path "data-manager/dist-dir/AWA数据管理" `
                           -DestinationPath "AWA数据管理-免安装版.zip" -Force

      # 单文件版：一个 exe，便于发给同事
      - name: 打包（单文件版）
        working-directory: data-manager
        shell: cmd
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed ^
            --name "AWA数据管理-单文件" ^
            --distpath dist-one --workpath build-one ^
            --hidden-import openpyxl ^
            --hidden-import PySide6.QtSvg ^
            desktop.py

      - name: 检查产物
        shell: pwsh
        run: |
          $one = "data-manager/dist-one/AWA数据管理-单文件.exe"
          $zip = "AWA数据管理-免安装版.zip"
          foreach ($p in @($one, $zip)) {
            if (-not (Test-Path $p)) {
              Write-Error "打包失败：未生成 $p"
              exit 1
            }
            $f = Get-Item $p
            "$($f.Name)  ->  $([math]::Round($f.Length/1MB,1)) MB"
          }
          "单文件 SHA256：$((Get-FileHash $one -Algorithm SHA256).Hash)"

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: AWA数据管理-windows
          path: |
            AWA数据管理-免安装版.zip
            data-manager/dist-one/AWA数据管理-单文件.exe
          retention-days: 30

      - name: 附到 Release（仅打 tag 时）
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            AWA数据管理-免安装版.zip
            data-manager/dist-one/AWA数据管理-单文件.exe
          generate_release_notes: true
